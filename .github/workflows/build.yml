name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android APK
      run: |
        # יצירת מבנה התיקיות
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/java/com/example/whatsappblocker
        
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f accessibility_service_config.xml ] && mv accessibility_service_config.xml app/src/main/res/xml/
        [ -f WhatsAppStatusBlockerService.kt ] && mv WhatsAppStatusBlockerService.kt app/src/main/java/com/example/whatsappblocker/
        [ -f build.gradle ] && mv build.gradle app/

        # יצירת settings.gradle בשורש
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "WhatsAppBlocker"
        include ':app'
        EOF

        # יצירת build.gradle ראשי ריק (ההגדרות נמצאות בתוך app/build.gradle)
        echo "// Root build file" > build.gradle

        # הפעלת גרידל ובניית ה-APK של מודול app ספציפית
        gradle wrapper --gradle-version 8.4
        ./gradlew :app:assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
