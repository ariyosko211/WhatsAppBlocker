name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android APK
      run: |
        # יצירת מבנה התיקיות המלא מאפס
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/java/com/example/whatsappblocker
        
        # העברת קבצי המקור למקום הנכון אם קיימים בתיקיית השורש
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f accessibility_service_config.xml ] && mv accessibility_service_config.xml app/src/main/res/xml/
        [ -f WhatsAppStatusBlockerService.kt ] && mv WhatsAppStatusBlockerService.kt app/src/main/java/com/example/whatsappblocker/

        # יצירת קובץ settings.gradle בשורש
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "WhatsAppBlocker"
        include ':app'
        EOF

        # יצירת קובץ build.gradle ראשי
        echo "// Root build" > build.gradle

        # יצירה אוטומטית של קובץ ה-build.gradle בתוך תיקיית app עם כל ההגדרות הנדרשות
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.whatsappblocker'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.whatsappblocker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        EOF

        # הפעלת גרידל ובניית ה-APK
        gradle wrapper --gradle-version 8.4
        ./gradlew :app:assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
